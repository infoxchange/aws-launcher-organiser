  Every other fixture in this directory is a sanitised capture of the real portal. This one is
  not: forcing the portal into a role-loading failure on demand is not something we can do, so
  the error markup below is reconstructed from the selectors the extension already relied on
  (data-testid="error-component-alert" and data-testid="retry-button").

  What that means for tests built on it: they exercise our error-handling CONTROL FLOW (is the
  alert detected, is the message read, is the retry button found), not AWS's actual error markup.
  If a real error state is ever captured, replace this file with it and delete this notice.

  @see docs/testing.md § "Fixtures"
-->
